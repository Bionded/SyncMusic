# Allowlist of the EMULATED test devices (one serial per kind, and one per xdist worker so parallel tests never
# show two disks with the same serial): loop images built by tests/emulated.py, each with a
# `<image>.device.json` sidecar carrying one of these USB serials. The blockdev guard accepts a loop device only
# when loop devices are allowed and its serial is listed here. No real disk carries these serials.

[emulated_flash]
usb_serial = "EMU0000000FLASH1"
usb_serial_aliases = [  # the same kind on xdist workers gw1..gw15 (tests/emulated.py: serial_of)
    "EMU0000000FL01H1", "EMU0000000FL02H1", "EMU0000000FL03H1", "EMU0000000FL04H1",
    "EMU0000000FL05H1", "EMU0000000FL06H1", "EMU0000000FL07H1", "EMU0000000FL08H1",
    "EMU0000000FL09H1", "EMU0000000FL10H1", "EMU0000000FL11H1", "EMU0000000FL12H1",
    "EMU0000000FL13H1", "EMU0000000FL14H1", "EMU0000000FL15H1",
]
usb_vendor_id = "0951"
usb_product_id = "1666"

