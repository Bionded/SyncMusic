# Samba for the SMB folder library: [music] needs the user of .env.test, [public] lets guests in.
# Both read only: SyncMusic never writes to a library. [devices] is writable: the SMB device. services.py copies the fixture media into /shared.
[global]
    server string = syncmusic-test
    security = user
    server min protocol = SMB2
    map to guest = Bad User
    guest account = nobody
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    unix charset = UTF-8

[music]
    path = /shared
    read only = yes
    browseable = yes
    valid users = samba

[public]
    path = /shared
    read only = yes
    browseable = yes
    guest ok = yes

[devices]
    path = /devices
    read only = no
    browseable = yes
    valid users = samba
    force user = samba
