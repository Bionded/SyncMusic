# SPDX-License-Identifier: GPL-3.0-or-later
# Releases. A version tag vX.Y.Z publishes a stable release; every push to main publishes a beta pre-release
# vX.Y.Z-N (X.Y.Z = the version in pyproject.toml, N = this workflow's run number). Both get the single-file web and
# desktop binaries for every target, SHA256SUMS and the Docker image (ghcr.io/bionded/syncmusic). Stable notes come
# from the CHANGELOG entry, beta notes are the commit subjects since the last stable release. Only the newest
# KEEP_BETAS pre-releases are kept. The app's update check reads these releases (channel stable or beta).
# After a stable X.Y.Z main says the next patch version (scripts/release.sh does that), so its betas sort after it.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]  # stable only: the beta tags are made by this workflow
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KEEP_BETAS: 10
  IMAGE: ghcr.io/bionded/syncmusic

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version, tag and notes
        id: v
        run: |
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
            tag="$GITHUB_REF_NAME" build="" prerelease=false
            awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next} on && /^## \[/ {exit} on {print}' \
              CHANGELOG.md | sed -e '/./,$!d' > notes.md
            [ -s notes.md ] || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          else
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version is released already: bump the version on main (scripts/release.sh does it)"
              exit 1
            fi
            build="$GITHUB_RUN_NUMBER" tag="v$version-$GITHUB_RUN_NUMBER" prerelease=true
            last="$(git tag --list 'v[0-9]*' | grep -v -- '-' | sort -V | tail -1 || true)"
            { echo "Test build $build of main - may have bugs. Changes since ${last:-the start}:"; echo
              git log --no-merges --max-count=50 --format='- %s' ${last:+"$last..HEAD"}; } > notes.md
          fi
          { echo "tag=$tag"; echo "version=$version"; echo "build=$build"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  binaries:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SYNCMUSIC_BUILD_NUMBER: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Single-file binaries (web and desktop, x86_64 and aarch64, built without compiling)
        run: |
          packaging/build-web --target all --out dist
          packaging/build-desktop --target all --out dist
      - name: Checksums
        run: cd dist && rm -f ./*.sha256 && sha256sum syncmusic-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  docker:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ needs.meta.outputs.prerelease == 'true' && 'beta' || 'latest' }}

  release:
    needs: [meta, binaries, docker]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Publish the release
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "SyncMusic $VERSION-$BUILD (beta)" \
              --notes-file notes.md dist/*
          else
            gh release create "$TAG" --verify-tag --title "SyncMusic $VERSION" --notes-file notes.md dist/*
          fi
      - name: Keep the newest beta pre-releases only
        if: needs.meta.outputs.prerelease == 'true'
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[env.KEEP_BETAS | tonumber:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
